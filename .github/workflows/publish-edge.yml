name: Publish Edge Add-on

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes for certification reviewers"
        required: false
        default: "Automated release update via GitHub Actions"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Edge Publish API credentials
        id: check_secrets
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=()
          if [[ -z "${EDGE_PRODUCT_ID:-}" ]]; then missing+=("EDGE_PRODUCT_ID"); fi
          if [[ -z "${EDGE_CLIENT_ID:-}" ]]; then missing+=("EDGE_CLIENT_ID"); fi
          if [[ -z "${EDGE_API_KEY:-}" ]]; then missing+=("EDGE_API_KEY"); fi

          if (( ${#missing[@]} > 0 )); then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
              exit 1
            fi
            echo "::notice::Skipping Edge Add-ons publish (missing secrets: ${missing[*]})"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Chromium/Edge extension package
        if: steps.check_secrets.outputs.enabled == 'true'
        run: |
          pwsh -NoProfile -File extension/package.ps1
          test -f dist/lajufile-extension-chromium.zip

      - name: Upload & Publish to Microsoft Edge Add-ons
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          BASE="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}"
          hdr_file=$(mktemp)
          body_file=$(mktemp)
          trap 'rm -f "$hdr_file" "$body_file"' EXIT

          extract_op_id() {
            local file="$1"
            local loc
            loc=$(grep -i '^location:' "$file" | tail -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//; s/\r$//; s/[[:space:]]+$//')
            loc="${loc%/}"
            if [[ -z "$loc" ]]; then
              return 1
            fi
            echo "${loc##*/}"
          }

          poll_operation() {
            local op_url="$1"
            local label="$2"
            local tmp_body
            tmp_body=$(mktemp)
            for attempt in $(seq 1 60); do
              local status_code
              status_code=$(curl -sS -o "$tmp_body" -w "%{http_code}" \
                -H "Authorization: ApiKey ${EDGE_API_KEY}" \
                -H "X-ClientID: ${EDGE_CLIENT_ID}" \
                "$op_url")
              if [[ ! "$status_code" =~ ^2 ]]; then
                echo "Error polling ${label} (HTTP ${status_code}):"
                cat "$tmp_body"
                rm -f "$tmp_body"
                return 1
              fi
              local state
              state=$(jq -r '.status // empty' "$tmp_body")
              echo "${label} poll #${attempt}: status=${state:-unknown}"
              case "$state" in
                Succeeded)
                  rm -f "$tmp_body"
                  return 0
                  ;;
                Failed)
                  echo "${label} failed:"
                  cat "$tmp_body"
                  rm -f "$tmp_body"
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "${label} timed out after 300s. Last response:"
            cat "$tmp_body"
            rm -f "$tmp_body"
            return 1
          }

          http_code=$(curl -sS -D "$hdr_file" -o "$body_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            --data-binary "@dist/lajufile-extension-chromium.zip" \
            "${BASE}/submissions/draft/package")
          if [[ "$http_code" != "202" ]]; then
            echo "Package upload failed (HTTP ${http_code}):"
            cat "$body_file"
            exit 1
          fi

          UPLOAD_OP_ID=$(extract_op_id "$hdr_file" || true)
          if [[ -z "$UPLOAD_OP_ID" ]]; then
            echo "Missing Location operation ID after package upload"
            cat "$body_file"
            exit 1
          fi
          poll_operation "${BASE}/submissions/draft/package/operations/${UPLOAD_OP_ID}" "package upload"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_NOTES:-}" ]]; then
            NOTES="$INPUT_NOTES"
          elif [[ "$EVENT_NAME" == "push" && -n "${REF_NAME:-}" ]]; then
            NOTES="Automated release update ${REF_NAME} via GitHub Actions"
          else
            NOTES="Automated release update via GitHub Actions"
          fi
          PAYLOAD=$(jq -n --arg notes "$NOTES" '{notes: $notes}')

          http_code=$(curl -sS -D "$hdr_file" -o "$body_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${BASE}/submissions")
          if [[ "$http_code" != "202" ]]; then
            echo "Publish submission failed (HTTP ${http_code}):"
            cat "$body_file"
            exit 1
          fi

          PUBLISH_OP_ID=$(extract_op_id "$hdr_file" || true)
          if [[ -z "$PUBLISH_OP_ID" ]]; then
            echo "Missing Location operation ID after publish submission"
            cat "$body_file"
            exit 1
          fi
          poll_operation "${BASE}/submissions/operations/${PUBLISH_OP_ID}" "submission publish"
          echo "Microsoft Edge Add-ons submission published successfully."
