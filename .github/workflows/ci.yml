name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev libayatana-appindicator3-dev libxdo-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check version parity & extension scripts
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const cargo=fs.readFileSync("Cargo.toml","utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1]; const ext=JSON.parse(fs.readFileSync("extension/manifest.json","utf8")).version; if(!cargo || cargo!==ext) throw new Error(`Version mismatch: Cargo.toml=${cargo} manifest.json=${ext}`);'
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/interceptor.js
          node --check extension/options.js
          node --check extension/popup.js
          node --test crates/lajufile-app/tests/extension_sender.mjs
