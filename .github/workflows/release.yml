name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build & Package Windows Installer
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          cargo build --release -p lajufile-app --bin lajufile --bin lajufile-setup
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = "dist/LajuFile-${{ github.ref_name }}-windows-x64-setup.exe"

          $pfx = $null
          $signTool = $null
          try {
            if ($env:WINDOWS_PFX_BASE64) {
              $pfx = Join-Path ([System.IO.Path]::GetTempPath()) "lajufile-sign-$([guid]::NewGuid().ToString('N')).pfx"
              [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
              $kitsRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
              $signTool = Get-ChildItem -Path $kitsRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
              if (-not $signTool) { throw "signtool.exe not found" }
              $ts = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
              $signArgs = @("sign", "/fd", "SHA256", "/tr", $ts, "/td", "SHA256", "/f", $pfx)
              if ($env:WINDOWS_PFX_PASSWORD) { $signArgs += @("/p", $env:WINDOWS_PFX_PASSWORD) }
              & $signTool @signArgs "target/release/lajufile.exe"
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for lajufile.exe" }
              & $signTool verify /pa "target/release/lajufile.exe"
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for lajufile.exe" }
            }

            $proc = Start-Process -FilePath "./target/release/lajufile-setup.exe" `
              -ArgumentList @(
                "--pack",
                "--stub", "target/release/lajufile-setup.exe",
                "--app", "target/release/lajufile.exe",
                "--ext", "extension",
                "--license", "LICENSE",
                "--readme", "README.md",
                "--out", $installer
              ) `
              -Wait -PassThru -NoNewWindow
            if ($proc.ExitCode -ne 0) { throw "Installer pack failed with exit code $($proc.ExitCode)" }

            if ($signTool -and $pfx) {
              $ts = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
              $signArgs = @("sign", "/fd", "SHA256", "/tr", $ts, "/td", "SHA256", "/f", $pfx)
              if ($env:WINDOWS_PFX_PASSWORD) { $signArgs += @("/p", $env:WINDOWS_PFX_PASSWORD) }
              & $signTool @signArgs $installer
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for installer" }
              & $signTool verify /pa $installer
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for installer" }
            }
          } finally {
            if ($pfx -and (Test-Path $pfx)) { Remove-Item -Force $pfx -ErrorAction SilentlyContinue }
          }
          & "./extension/package.ps1"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/LajuFile-${{ github.ref_name }}-windows-x64-setup.exe
            dist/lajufile-extension-chromium.zip
            dist/lajufile-extension-firefox.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev libayatana-appindicator3-dev libxdo-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Package Linux Installer
        env:
          TAG_OVERRIDE: ${{ github.ref_name }}
        run: |
          chmod +x installer/build-unix-installer.sh
          ./installer/build-unix-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/LajuFile-${{ github.ref_name }}-linux-*-setup.run
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS Installer
        env:
          TAG_OVERRIDE: ${{ github.ref_name }}
        run: |
          chmod +x installer/build-unix-installer.sh
          ./installer/build-unix-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/LajuFile-${{ github.ref_name }}-macos-*-setup.dmg
            dist/LajuFile-${{ github.ref_name }}-macos-*-setup
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          LC_ALL=C sha256sum LajuFile-* lajufile-extension-*.zip | sort -k2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          fi
