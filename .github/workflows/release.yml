name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lajufile-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lajufile.exe dist/
          Copy-Item extension dist/extension -Recurse
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "LajuFile-${{ github.ref_name }}-windows-x64.zip"
      - name: Publish Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" "LajuFile-${{ github.ref_name }}-windows-x64.zip" --clobber
          if ($LASTEXITCODE -eq 0) {
            gh release edit "${{ github.ref_name }}" --draft=false --latest
          } else {
            gh release create "${{ github.ref_name }}" "LajuFile-${{ github.ref_name }}-windows-x64.zip" --title "${{ github.ref_name }}" --generate-notes
          }

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libayatana-appindicator3-dev libxdo-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lajufile-app
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/lajufile dist/
          chmod +x dist/lajufile
          cp -r extension dist/extension
          cp README.md LICENSE dist/
          tar -czf "LajuFile-${{ github.ref_name }}-linux-x64.tar.gz" -C dist .
      - name: Publish Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "LajuFile-${{ github.ref_name }}-linux-x64.tar.gz" --clobber
          gh release edit "${{ github.ref_name }}" --draft=false --latest
