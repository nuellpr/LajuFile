name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lajufile-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lajufile.exe dist/
          Copy-Item extension dist/extension -Recurse
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "LajuFile-${{ github.ref_name }}-windows-x64.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "LajuFile-${{ github.ref_name }}-windows-x64.zip" --title "${{ github.ref_name }}" --generate-notes
