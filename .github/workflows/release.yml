name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lajufile-app --bin lajufile --bin lajufile-setup
      - name: Package Windows Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = "dist/LajuFile-${{ github.ref_name }}-windows-x64-setup.exe"
          $proc = Start-Process -FilePath "./target/release/lajufile-setup.exe" `
            -ArgumentList @(
              "--pack",
              "--stub", "target/release/lajufile-setup.exe",
              "--app", "target/release/lajufile.exe",
              "--ext", "extension",
              "--license", "LICENSE",
              "--readme", "README.md",
              "--out", $installer
            ) `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Installer pack failed with exit code $($proc.ExitCode)" }
      - name: Publish Windows Installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = "dist/LajuFile-${{ github.ref_name }}-windows-x64-setup.exe"
          gh release upload "${{ github.ref_name }}" $installer --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" $installer --title "${{ github.ref_name }}" --generate-notes
          }

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev libayatana-appindicator3-dev libxdo-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Package Linux Installer
        env:
          TAG_OVERRIDE: ${{ github.ref_name }}
        run: |
          chmod +x installer/build-unix-installer.sh
          ./installer/build-unix-installer.sh
      - name: Publish Linux Installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/LajuFile-${{ github.ref_name }}-linux-*-setup.run --clobber

  macos:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS Installer
        env:
          TAG_OVERRIDE: ${{ github.ref_name }}
        run: |
          chmod +x installer/build-unix-installer.sh
          ./installer/build-unix-installer.sh
      - name: Publish macOS Installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/LajuFile-${{ github.ref_name }}-macos-*-setup.dmg \
            dist/LajuFile-${{ github.ref_name }}-macos-*-setup --clobber
