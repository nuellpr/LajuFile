[workspace]
members = ["crates/lajufile-core", "crates/lajufile-app"]
resolver = "3"

[workspace.package]
version = "2.0.0"
authors = ["Nuel Wallep"]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
arboard = "3"
content_disposition = "0.4"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "clipboard", "links", "x11", "wayland"] }
egui = "0.37"
egui_extras = "0.37"
hex = "0.4"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "socks"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tray-icon = "0.26"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
