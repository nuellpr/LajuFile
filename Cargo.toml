[workspace]
members = ["crates/lajufile-core", "crates/lajufile-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
content_disposition = "0.4"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }
egui = "0.37"
egui_extras = "0.37"
hex = "0.4"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tray-icon = "0.26"
url = "2"
